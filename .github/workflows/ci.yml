name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Remote-cache identity is a write credential for the whole team cache, and the
  # job below executes package scripts out of the checked-out work tree. On a
  # pull_request that work tree is the PR author's, so the token is withheld
  # there: PRs run with a local cache only. `A && B || ''` is the GitHub
  # expression form of a conditional secret (falsy '' keeps the key out).
  TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
  # The team slug is not a secret. Keeping it in a repository variable rather than
  # a secret stops GitHub censoring it as *** in job logs.
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_CACHE_DIR: ~/.turbo

jobs:
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` input on purpose: pnpm/action-setup reads the version from
      # the `packageManager` field, so package.json stays the single source of truth.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
